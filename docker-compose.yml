# Local development services. Start with: pnpm services:up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bnw
      POSTGRES_PASSWORD: bnw
      POSTGRES_DB: bnw
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnw"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: dev_master_key_change_me
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256Mb
    ports: ["7700:7700"]
    volumes: [meili:/meili_data]

  # Catches all outgoing email in dev. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  meili:
