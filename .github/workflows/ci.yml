name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bnw
          POSTGRES_PASSWORD: bnw
          POSTGRES_DB: bnw_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bnw" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      DATABASE_URL: postgresql://bnw:bnw@localhost:5433/bnw_test?schema=public
      TEST_DATABASE_URL: postgresql://bnw:bnw@localhost:5433/bnw_test?schema=public
      TEST_REDIS_URL: redis://localhost:6380/1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bnw/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @bnw/api test
      - run: pnpm build
